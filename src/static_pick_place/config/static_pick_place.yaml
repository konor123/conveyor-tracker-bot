# static_pick_place 설정. 수치 키는 단위 접미사(_m, _s, _mps, _mps2, _rad, _hz, _ma, _pulse, _count, _ratio)를 붙인다.
# 높이·그리퍼 값은 2026-11-09 LEGION 현장 시험 값(records/worklog/2026-11-09.md). 보정·평면 파일은 현장 덮어쓰기 파일로 준다.
calibration_file: ''          # camera_extrinsics.yaml (robot_base ← camera_color_optical_frame)
mat_plane_file: ''            # mat_plane.yaml (frame robot_base, calibration_id 일치)
belt_plane_file: ''
image_topic: /camera/camera/color/image_raw
robot_namespace: dsr01
# 대상물 높이(vision 평면 교차)
h_stone_offset_m: 0.015       # 공깃돌 높이(사용자 실측 15 mm) → 위치 z = 공깃돌 윗면
h_rim_m: 0.022                # 벨트면 → 뚜껑 테두리 윗면(사용자 실측: 매트면에서 115 mm, 벨트면은 매트면 + 93 mm)
floor_thickness_m: 0.0015     # TBD
inner_diameter_ratio: 0.80    # TBD(D_in)
# 경유점(플랜지 높이)
travel_z_m: 0.2844
grasp_above_stone_top_m: 0.1620
release_above_rim_m: 0.1656      # 투입 성공 0.1606에서 5 mm 올림(사용자 지시)
travel_v_mps: 0.100
vertical_v_mps: 0.050
travel_a_mps2: 0.300
vertical_a_mps2: 0.150
# 그리퍼(하드웨어 pulse)
open_pulse: 600
close_pulse: 750
grip_current_ma: 150
gripper_read_timeout_s: 0.5    # 응답 대기. 0.25 s는 가끔, 0.15 s 이하는 항상 놓침. 왕복은 약 0.58 s 고정(2026-11-09)
gripper_timeout_s: 15.0
# 작업 공간·도달 여유
x_min_m: 0.30
x_max_m: 0.75
y_min_m: -0.25
y_max_m: 0.25
z_min_m: 0.10
j3_min_rad: 0.1745
park_x_m: 0.373
park_y_m: 0.0
park_z_m: 0.405
