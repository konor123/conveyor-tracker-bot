# 정상 경로(ROS I0). 벨트 20 mm/s 등속, 병뚜껑 2개(반 바퀴 간격), 매트 공깃돌 1개.
# 실측이 아닌 값은 assumed에 둔다.
name: nominal_20mms
seed: 0
unitless: [seed]
frame_rate_hz: 30.0

world:
  belt:
    speed_mps: 0.020
    lap_length_m: 1.20
    unsteady_hold_s: 2.0
    speed_std_mps: 0.0002
    window_s: 1.0
  zones:                          # conveyor_frame x
    obs_start_m: 0.0
    obs_end_m: 0.45
    reach_start_m: 0.20
    reach_end_m: 0.40
  frames:                         # robot_base 기준
    conveyor_xyz_m: [0.30, -0.25, 0.0]
    conveyor_yaw_rad: 0.0
    mat_xyz_m: [0.35, 0.15, 0.0]
    mat_yaw_rad: 0.0
  camera:
    xyz_m: [0.50, -0.05, 0.35]
    hfov_rad: 1.5708
    width_count: 1280
    height_count: 800
    pixel_std_ratio: 0.0
  objects:
    stone_diameter_m: 0.0175
    stone_height_m: 0.008
    cap_outer_diameter_m: 0.032
    cap_rim_height_m: 0.010
  noise:
    position_std_m: 0.0
  tracking:
    valid_for_s: 0.3
  caps:
    - {x0_m: -0.05, y_m: 0.0}
    - {x0_m: 0.55, y_m: 0.0}
  stones:
    - {x_m: 0.0, y_m: 0.0}
  verify:
    - {verdict: SUCCESS, stone_offset_m: 0.002}

robot:
  duration_scale_ratio: 1.0
  skills:
    PickStone: [{duration_s: 4.0}]
    MoveToPose: [{duration_s: 2.0}]
    PlaceStone: [{duration_s: 2.5}]
    DynamicPlace: [{duration_s: 3.0}]
    SafeRetreat: [{duration_s: 3.0}]

events: []

assumed:
  - world.belt                    # 다이얼 실측 전(OFF-1 B01·B04)
  - world.zones                   # 배치도 전(OFF-1 L05·L06)
  - world.frames                  # 보정 전(OFF-3)
  - world.camera                  # 높이 0.35 m만 실측(L01), XY·FOV 프로파일 미확인
  - world.objects.stone_height_m
  - world.objects.cap_rim_height_m
  - world.noise
  - world.tracking
  - world.caps
  - world.stones
  - world.verify
  - robot                         # skill 소요시간·결과 값은 G0 측정 전
measured:
  world.objects.stone_diameter_m: "OFF-1 2026-11-07 S01·S02, 17~18 mm 중간값"
  world.objects.cap_outer_diameter_m: "OFF-1 2026-11-07 C02"
