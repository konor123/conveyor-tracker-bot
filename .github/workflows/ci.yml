name: CI (M0 Offline & I0 Mock Suite)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ROS_DOMAIN_ID: "142"
  ROS_AUTOMATIC_DISCOVERY_RANGE: "LOCALHOST"

jobs:
  m0-verify:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trust the checked-out workspace in the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-jsonschema \
            python3-numpy \
            python3-opencv \
            python3-pytest \
            python3-yaml \
            ros-jazzy-launch-ros \
            ros-jazzy-launch-testing-ament-cmake \
            ros-jazzy-lifecycle-msgs \
            ros-jazzy-tf2-ros

      - name: Build workspace
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install

      - name: Run spec and eval unit tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          PYTHONPATH="$PWD/tools/spec:${PYTHONPATH:-}" python3 -m pytest tools/spec -v
          python3 -m pytest tools/eval -v

      - name: Run orchestrator and drop_mocks unit tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          PYTHONPATH="$PWD/tools/spec:${PYTHONPATH:-}" python3 -m pytest src/orchestrator/test -v
          python3 -m pytest src/drop_mocks/test --ignore=src/drop_mocks/test/contract -m "not realtime_pc" -v

      # 실시간 스케줄 시험(TC-MCK-005-01 실시간 부분, controller 상태·heartbeat 10 Hz)은 공유 러너에서 실행·기록만 한다. 판정은 PC(TEST_SPEC.md 0.3절).
      - name: Run realtime mock timing tests (record only, judged on PC)
        shell: bash
        continue-on-error: true
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          # 패키지마다 conftest가 달라 한 pytest 실행에 함께 넣지 않는다
          if python3 -m pytest src/drop_mocks/test -m realtime_pc -v -rA --junitxml=realtime-pc.xml \
             && python3 -m pytest src/robot_control/test -m realtime_pc -v -rA --junitxml=realtime-pc-robot.xml; then
            echo "realtime_pc: passed on CI (record only; judged on PC)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "realtime_pc: FAILED on CI (record only; judged on PC, see step log)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Run robot_control and calibration tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 -m pytest src/robot_control/test -m "not realtime_pc" -v
          python3 -m pytest src/calibration/test -v

      - name: Run tracking and intercept_planner unit, contract and I2 tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 -m pytest src/tracking/test -v
          python3 -m pytest src/intercept_planner/test -v

      - name: Run vision tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 -m pytest src/vision/test -m "not realtime_pc" -v

      # vision 계약 시험 중 처리 시간·10 Hz 타이머에 의존하는 것은 공유 러너에서 실행·기록만 한다. 판정은 PC.
      - name: Run realtime vision contract tests (record only, judged on PC)
        shell: bash
        continue-on-error: true
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          if python3 -m pytest src/vision/test -m realtime_pc -v -rA; then
            echo "vision realtime_pc: passed on CI (record only; judged on PC)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "vision realtime_pc: FAILED on CI (record only; judged on PC, see step log)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Run contract and I0 integration tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 -m pytest src/drop_mocks/test/contract -m "not realtime_pc" -v
          PYTHONPATH="$PWD/tools/spec:${PYTHONPATH:-}" python3 -m pytest src/drop_bringup/test -m "not realtime_pc" -v

      # 실제 robot_controller_node의 100 Hz 동적 루프(간격 한도 30 ms)에 의존하는 I0는 공유 러너에서 실행·기록만 한다. 판정은 PC.
      - name: Run realtime I0 tests (record only, judged on PC)
        shell: bash
        continue-on-error: true
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          if PYTHONPATH="$PWD/tools/spec:${PYTHONPATH:-}" python3 -m pytest src/drop_bringup/test -m realtime_pc -v -rA; then
            echo "I0 realtime_pc: passed on CI (record only; judged on PC)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "I0 realtime_pc: FAILED on CI (record only; judged on PC, see step log)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Check M0 requirement/test trace
        shell: bash
        run: |
          python3 tools/spec/trace.py --gate M0 --check
          python3 tools/spec/trace.py --area SYS,IF,ORC,ABT,MCK,REC,INT --check || true
